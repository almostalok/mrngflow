services:
  postgres:
    image: postgres:17-alpine
    container_name: mrngflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrngflow
      POSTGRES_PASSWORD: mrngflow_dev
      POSTGRES_DB: mrngflow
    ports:
      - "5432:5432"
    volumes:
      - mrngflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mrngflow -d mrngflow" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mrngflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mrngflow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mrngflow_postgres_data:
  mrngflow_redis_data:
